<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت چیکاچوب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brown:#79543d;--cream:#f7f2e8;--line:#e4dbcf;--ink:#302820}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:var(--brown);color:white;padding:22px 16px;text-align:center;font-size:23px;font-weight:bold}
main{max-width:900px;margin:28px auto;padding:0 14px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #00000008}
h2{margin:0 0 18px;font-size:21px}
label{display:block;margin:14px 0 7px}
input,select,textarea,button{font:inherit;width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button{background:var(--brown);color:white;border:0;font-weight:bold;cursor:pointer;margin-top:14px}
button.secondary{background:#eee7de;color:var(--ink)}
button.danger{background:#a94442}
.hidden{display:none!important}
.muted{color:#81786f;font-size:14px;line-height:1.8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.toolbar button{width:auto;flex:1;min-width:130px}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.item strong{display:block;margin-bottom:7px}
.item small{color:#776d63}
.status{padding:10px;border-radius:10px;background:#f1eee8;margin:12px 0;line-height:1.8}
@media(max-width:600px){.row{grid-template-columns:1fr}main{margin-top:16px}.card{padding:17px}}
</style>
</head>
<body>
<header>پنل مدیریت چیکاچوب</header>
<main>

<section id="loginCard" class="card">
<h2>ورود مدیر</h2>
<p class="muted">با ایمیل و رمز عبور حساب مدیریت وارد شوید.</p>
<label for="email">ایمیل</label>
<input id="email" type="email" autocomplete="username" placeholder="ایمیل مدیر">
<label for="password">رمز عبور</label>
<input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">
<button id="loginBtn">ورود</button>
<div id="loginMsg" class="status hidden"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>مدیریت فروشگاه</h2>
<div class="toolbar">
<button id="productsTab">محصولات</button>
<button id="categoriesTab" class="secondary">دسته‌بندی‌ها</button>
<button id="logoutBtn" class="danger">خروج</button>
</div>
<div id="appMsg" class="status">به پنل مدیریت خوش آمدید.</div>
</div>

<section id="productsSection">
<div class="card">
<h2 id="formTitle">افزودن محصول</h2>
<input id="productId" type="hidden">
<label>نام محصول</label>
<input id="pName" placeholder="مثلاً تخت تمام پارچه تدی">
<label>دسته‌بندی</label>
<select id="pCategory"><option value="">انتخاب دسته‌بندی</option></select>
<div class="row">
<div>
<label>قیمت (تومان)</label>
<input id="pPrice" type="number" min="0" placeholder="قیمت">
</div>
<div>
<label>قیمت قبل از تخفیف (اختیاری)</label>
<input id="pCompare" type="number" min="0" placeholder="در صورت نیاز">
</div>
</div>
<label>آدرس تصویر محصول</label>
<input id="pImage" type="url" placeholder="https://...">
<label>توضیحات</label>
<textarea id="pDescription" placeholder="توضیحات محصول"></textarea>
<label><input id="pActive" type="checkbox" checked style="width:auto"> محصول فعال و قابل نمایش باشد</label>
<div class="toolbar">
<button id="saveProduct">ذخیره محصول</button>
<button id="clearForm" class="secondary">پاک کردن فرم</button>
</div>
</div>

<div class="card">
<h2>فهرست محصولات</h2>
<div id="productsList" class="muted">در حال دریافت اطلاعات...</div>
</div>
</section>

<section id="categoriesSection" class="hidden">
<div class="card">
<h2>دسته‌بندی‌های ثبت‌شده</h2>
<div id="categoriesList" class="muted">در حال دریافت اطلاعات...</div>
</div>
<div class="card">
<h2>افزودن دسته‌بندی</h2>
<label>نام دسته‌بندی</label>
<input id="newCategory" placeholder="نام دسته‌بندی">
<button id="addCategory">ثبت دسته‌بندی</button>
</div>
</section>
</section>
</main>

<script>
(() => {
const SUPABASE_URL = 'https://hvnlmrastgtqnykconcm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E9xpF5HDNW-bjJt5CtzKkg_ilzJ-KpO';
const ADMIN_UID = '8870a27f-39d4-4cb6-befb-9b0ac0fff81c';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let categories = [];

function message(text, target='appMsg') {
const el=$(target);
el.textContent=text;
el.classList.remove('hidden');
}

function escapeHtml(value) {
return String(value ?? '').replace(/[&<>"']/g, c => ({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

async function showDashboard() {
$('loginCard').classList.add('hidden');
$('dashboard').classList.remove('hidden');
await loadCategories();
await loadProducts();
}

async function checkSession() {
const {data:{session}} = await db.auth.getSession();
if (session?.user?.id === ADMIN_UID) await showDashboard();
}

$('loginBtn').addEventListener('click', async () => {
message('در حال ورود...', 'loginMsg');

const {data,error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});

if(error){
message('ورود انجام نشد: '+error.message,'loginMsg');
return;
}

if(data.user.id !== ADMIN_UID){
await db.auth.signOut();
message('این حساب اجازه ورود به پنل مدیریت را ندارد.','loginMsg');
return;
}

await showDashboard();
});

$('logoutBtn').addEventListener('click', async()=>{
await db.auth.signOut();
location.reload();
});

async function loadCategories(){
const {data,error}=await db.from('categories')
.select('id,name').order('name');

if(error){
message('خطا در دریافت دسته‌بندی‌ها: '+error.message);
return;
}

categories=data||[];

$('pCategory').innerHTML=
'<option value="">انتخاب دسته‌بندی</option>'+
categories.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');

$('categoriesList').innerHTML=categories.length
?categories.map(c=>`<div class="item">${escapeHtml(c.name)}</div>`).join('')
:'هنوز دسته‌بندی ثبت نشده است.';
}

async function loadProducts(){
$('productsList').textContent='در حال دریافت اطلاعات...';

const {data,error}=await db.from('products')
.select('id,name,category_id,price,description,image_url,is_active')
.order('created_at',{ascending:false});

if(error){
$('productsList').textContent='خطا در دریافت محصولات: '+error.message;
return;
}

if(!data?.length){
$('productsList').textContent='هنوز محصولی ثبت نشده است.';
return;
}

$('productsList').innerHTML=data.map(p=>{
const cat=categories.find(c=>c.id===p.category_id)?.name||'بدون دسته‌بندی';

return `<div class="item">
<strong>${escapeHtml(p.name)}</strong>
<small>${escapeHtml(cat)} | ${Number(p.price||0).toLocaleString('fa-IR')} تومان | ${p.is_active?'فعال':'غیرفعال'}</small>
<div class="toolbar">
<button class="secondary" data-edit="${escapeHtml(p.id)}">ویرایش</button>
<button class="danger" data-delete="${escapeHtml(p.id)}">حذف</button>
</div>
</div>`;
}).join('');

$('productsList').querySelectorAll('[data-edit]').forEach(b=>
b.addEventListener('click',()=>editProduct(data.find(p=>p.id===b.dataset.edit)))
);

$('productsList').querySelectorAll('[data-delete]').forEach(b=>
b.addEventListener('click',()=>deleteProduct(b.dataset.delete))
);
}

function editProduct(p){
$('productId').value=p.id;
$('pName').value=p.name||'';
$('pCategory').value=p.category_id||'';
$('pPrice').value=p.price??'';
$('pImage').value=p.image_url||'';
$('pDescription').value=p.description||'';
$('pActive').checked=!!p.is_active;
$('formTitle').textContent='ویرایش محصول';
window.scrollTo({top:0,behavior:'smooth'});
}

function clearForm(){
['productId','pName','pCategory','pPrice','pCompare','pImage','pDescription']
.forEach(id=>$(id).value='');

$('pActive').checked=true;
$('formTitle').textContent='افزودن محصول';
}

$('clearForm').addEventListener('click',clearForm);

$('saveProduct').addEventListener('click',async()=>{
const name=$('pName').value.trim();
const price=Number($('pPrice').value);

if(!name || !Number.isFinite(price) || price<0){
message('نام و قیمت معتبر محصول را وارد کنید.');
return;
}

const payload={
name,
category_id:$('pCategory').value||null,
price,
description:$('pDescription').value.trim()||null,
image_url:$('pImage').value.trim()||null,
is_active:$('pActive').checked
};

const id=$('productId').value;

const result=id
?await db.from('products').update(payload).eq('id',id)
:await db.from('products').insert(payload);

if(result.error){
message('ذخیره نشد: '+result.error.message);
return;
}

message('محصول با موفقیت ذخیره شد.');
clearForm();
await loadProducts();
});

async function deleteProduct(id){
if(!confirm('این محصول حذف شود؟'))return;

const {error}=await db.from('products').delete().eq('id',id);

if(error){
message('حذف انجام نشد: '+error.message);
return;
}

message('محصول حذف شد.');
await loadProducts();
}

$('addCategory').addEventListener('click',async()=>{
const name=$('newCategory').value.trim();

if(!name){
message('نام دسته‌بندی را وارد کنید.');
return;
}

const {error}=await db.from('categories').insert({name});

if(error){
message('ثبت دسته‌بندی انجام نشد: '+error.message);
return;
}

$('newCategory').value='';
message('دسته‌بندی ثبت شد.');
await loadCategories();
});

$('productsTab').addEventListener('click',()=>{
$('productsSection').classList.remove('hidden');
$('categoriesSection').classList.add('hidden');
$('productsTab').classList.remove('secondary');
$('categoriesTab').classList.add('secondary');
});

$('categoriesTab').addEventListener('click',()=>{
$('categoriesSection').classList.remove('hidden');
$('productsSection').classList.add('hidden');
$('categoriesTab').classList.remove('secondary');
$('productsTab').classList.add('secondary');
});

checkSession();
})();
</script>
</body>
</html>
